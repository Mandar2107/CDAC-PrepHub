services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prephub
      POSTGRES_USER: prephub
      POSTGRES_PASSWORD: prephub
    ports:
      - "5432:5432"
    volumes:
      - prephub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prephub -d prephub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prephub-postgres:
